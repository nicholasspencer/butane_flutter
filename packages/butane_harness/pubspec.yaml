name: butane_harness
description: "BLE harness app for testing butane central/peripheral roles."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  butane:
    path: ../butane
  # Direct deps on the platform-implementation plugins so Flutter's Dart
  # plugin registrant generator sees their dartPluginClass. Going through
  # butane (which uses default_package) isn't enough — the registrant
  # walks direct deps only.
  butane_core_bluetooth:
    path: ../butane_core_bluetooth
  butane_android:
    path: ../butane_android
  butane_windows:
    path: ../butane_windows
  butane_platform_interface:
    path: ../butane_platform_interface
  cupertino_icons: ^1.0.8
  # Hosted 0.1.3 is the compatible perception release: it requires
  # genesis_tree ^0.1.4, and genesis_tree 0.1.5 is published.
  genesis_perception: ^0.1.3
  # The extension contract (LeonardTool/ToolResult/BusyState/…) —
  # leonard_flutter re-exports only LeonardExtension.
  leonard_contract: ^0.1.0
  # Hosted leonard_flutter 0.1.8 includes the extensionsReady barrier used by
  # the harness before it publishes its VM-service endpoint.
  leonard_flutter: ^0.1.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
