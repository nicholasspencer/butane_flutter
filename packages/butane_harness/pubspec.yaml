name: butane_harness
description: "BLE harness app for testing butane central/peripheral roles."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  butane:
    path: ../butane
  # Direct deps on the platform-implementation plugins so Flutter's Dart
  # plugin registrant generator sees their dartPluginClass. Going through
  # butane (which uses default_package) isn't enough — the registrant
  # walks direct deps only.
  butane_core_bluetooth:
    path: ../butane_core_bluetooth
  butane_android:
    path: ../butane_android
  butane_platform_interface:
    path: ../butane_platform_interface
  cupertino_icons: ^1.0.8
  # Node/Field/Seed for the leonard perception fragment (resolved to the
  # sibling genesis checkout via the root overrides — see that file's note).
  genesis_perception: ^0.1.2
  # The extension contract (LeonardTool/ToolResult/BusyState/…) —
  # leonard_flutter re-exports only LeonardExtension.
  leonard_contract: ^0.1.0
  # The leonard host: claims the WidgetsBinding slot (debug/profile only) and
  # exposes ext.exploration.* so leonard_drive / the burn can perceive+drive
  # this harness. Path-linked via the root pubspec_overrides.yaml until the
  # extensionsReady barrier ships in a hosted release.
  leonard_flutter: ^0.1.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
