name: butane_core_bluetooth
description: "Darwin implementation of Butane Bluetooth Low Energy for Flutter using Core Bluetooth."
version: 0.1.0
homepage: https://github.com/nicholasspencer/butane
repository: https://github.com/nicholasspencer/butane_flutter
resolution: workspace

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  butane_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  plugin:
    implements: butane_platform_interface
    platforms:
      ios:
        pluginClass: ButaneCoreBluetoothPlugin
        dartPluginClass: ButaneCoreBluetooth
        sharedDarwinSource: true
      macos:
        pluginClass: ButaneCoreBluetoothPlugin
        dartPluginClass: ButaneCoreBluetooth
        sharedDarwinSource: true
