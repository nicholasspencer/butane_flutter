name: butane_grid_assets
description: >-
  The butane burn asset domain (ADR-0011 D9, M6 Track F) — the cross-station
  BURN formula: two capability-scoped orders (`burn-host` local + `burn-follower`
  leased to a capability match) over two orthogonal channels — the federation BUS
  (lease + endpoint rendezvous) and the DIRECT `leonard_drive` ↔ `ext.exploration.*`
  perception channel. The follower provisions/builds/launches the app-under-test
  exposing exploration + publishes its endpoint and is torn down via the M4
  `terminateGroup`/pgid reaper; the host attaches `leonard_drive`, runs a SCRIPTED
  (zero-model) scenario, and collects a domain `TestReport`. Lives with its
  system: `butane_flutter` is the pack's home (the ADR-0011 placement split,
  landed — grid assets belong with their system).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

# Private `any` dependencies below require the machine-local, gitignored
# pubspec_overrides.yaml until butane_flutter-t9y ports the pack to the current
# Grid CLI/engine API and adopts hosted constraints.
dependencies:
  args: ^2.5.0
  grid_assets: any
  # grid_cli: the legacy CLI SDK (StationRunCommand/ServeCommand) the pack's
  # BurnRunCommand + bin/butane_station assemble on until t9y ports them.
  grid_cli: any
  # Bead (the FormulaResolver policy input) — grid_engine's typedef names it.
  beads_dart: any
  grid_engine: any
  # Federation transport implementations used by the burn; contracts are in
  # grid_engine and symbol imports migrate under butane_flutter-t9y.
  federated_grid_assets: any
  grid_runtime: any
  meta: ^1.16.0

dev_dependencies:
  # grid_exploration backs the pipeline-proof live-local follower daemon
  # (tool/follower_daemon.dart); beads_dart is a lib dependency.
  grid_exploration: any
# Wide: co-resolves with the butane workspace's flutter_lints-era pin (^3.0.0).
  lints: ">=3.0.0 <6.0.0"
  test: ^1.25.0
