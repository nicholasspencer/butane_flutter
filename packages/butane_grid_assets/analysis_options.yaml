# The pack keeps `lints/recommended` (its power_station posture) and adopts the
# butane house rules (trailing commas as error + strict modes) explicitly — the
# repo root analysis_options.yaml is rule-only (no lints include), so a bare
# `include: ../../analysis_options.yaml` would silently DROP the recommended set.
include: package:lints/recommended.yaml

linter:
  rules:
    - require_trailing_commas

analyzer:
  errors:
    require_trailing_commas: error
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
