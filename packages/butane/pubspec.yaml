name: butane
description: A new Flutter package project.
version: 0.0.1
homepage: https://github.com/nicholasspencer/butane
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  butane_platform_interface:
    path: ../butane_platform_interface
  butane_bluez:
    path: ../butane_bluez
  meta: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  plugin:
    platforms:
      android:
        default_package: butane_android
      ios:
        default_package: butane_core_bluetooth
      macos:
        default_package: butane_core_bluetooth
      linux:
        default_package: butane_bluez
