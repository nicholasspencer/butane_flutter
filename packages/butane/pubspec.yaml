name: butane
description: A reactive, cross-platform Bluetooth Low Energy API for Flutter applications.
version: 0.1.0
homepage: https://github.com/nicholasspencer/butane
repository: https://github.com/nicholasspencer/butane_flutter
resolution: workspace

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  butane_dart: ^0.1.0
  butane_platform_interface: ^0.1.0
  butane_core_bluetooth: ^0.1.0
  butane_android: ^0.1.0
  butane_bluez: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  plugin:
    platforms:
      android:
        default_package: butane_android
      ios:
        default_package: butane_core_bluetooth
      macos:
        default_package: butane_core_bluetooth
      linux:
        default_package: butane_bluez
