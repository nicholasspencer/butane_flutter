name: butane_coordinator
description: >-
  CLI coordinator that connects to BLE test harness instances via WebSocket,
  runs test scenarios, and reports pass/fail per step with timing.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  args: ^2.6.0
  multicast_dns: ^0.3.2+7
  web_socket_channel: ^3.0.2
