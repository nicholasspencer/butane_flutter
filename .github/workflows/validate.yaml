name: Validate

on:
  merge_group:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tracked dependency state
        run: bash tool/validate.sh --repo
      - name: Test dependency validator
        run: bash tool/validate_test.sh

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - name: Analyze every package
        run: bash tool/ci.sh analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - name: Run unit suites
        run: bash tool/ci.sh test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      # The Gradle wrapper is untracked; a config-only build generates it.
      - name: Generate the example Gradle project
        working-directory: packages/butane_android/example
        run: flutter build apk --debug --config-only
      - name: Compile the butane_android Kotlin sources
        working-directory: packages/butane_android/example/android
        run: ./gradlew :butane_android:compileDebugKotlin
